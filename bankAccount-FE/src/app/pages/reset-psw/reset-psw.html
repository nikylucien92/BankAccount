<div class="bg-[#F5F7FA] w-screen h-screen flex flex-col justify-center items-center">
  <form
    (ngSubmit)="onResetPsw(user)"
    class="bg-white w-xl flex flex-col items-center rounded-[30px] px-11 py-7.75"
  >
    <!-- icona del sito -->
    <img [ngSrc]="logoUrl" [alt]="logoAlt" width="183" height="36" priority />
    <!-- testo login -->
    <h1 class="fw-semibold text-[25px] mb-8">Reset password</h1>
    <!-- input email -->
    <fieldset class="fieldset w-sm mb-3">
      <label class="label gap-0" for="emailUser">Email<span class="text-[#FE5C73]">*</span></label>
      <input
        type="email"
        id="emailUser"
        name="emailUser"
        class="input w-full"
        placeholder="Inserire email"
        [(ngModel)]="user.email"
        [pattern]="regexService.emailRegex"
        required
      />
    </fieldset>
    <!-- input psw -->
    <fieldset class="fieldset w-sm mb-3">
      <label class="label gap-0" for="pswUser">Password<span class="text-[#FE5C73]">*</span></label>
      <input
        type="password"
        id="pswUser"
        name="pswUser"
        class="input w-full"
        placeholder="Inserire password"
        [(ngModel)]="user.password"
        minlength="8"
        required
      />
    </fieldset>
    <!-- conferma psw -->
    <fieldset class="fieldset w-sm mb-1">
      <label class="label gap-0" for="confirmPsw"
        >Conferma password<span class="text-[#FE5C73]">*</span></label
      >
      <input
        type="password"
        id="confirmPsw"
        name="confirmPsw"
        class="input validator w-full"
        placeholder="Inserire password"
        [(ngModel)]="user.confirmPassword"
        minlength="8"
        required
      />
    </fieldset>
    <!-- non hai un account? -->
    <div class="text-end w-sm">
      <a routerLink="/signin" class="text-[#1814F3] hover:text-[#1814f39e] fw-medium text-[11px]"
        >Non hai un account?
      </a>
    </div>
    <!-- button submit -->
    <div class="w-sm">
      <button class="w-full btn btn-primary" type="submit">Reset password</button>
    </div>
  </form>
</div>
